# Producción en un servidor con Docker. Todo queda en una red interna; lo único
# expuesto es Caddy (80/443), que sirve el front y reenvía /api y /socket.io al gateway.
#
#   cp infra/.env.prod.example infra/.env.prod   # y completar
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
#
# Ver docs/deploy.md.

name: turnos-prod

x-service: &service
  image: ${TURNOS_IMAGE:-turnos:local}
  build:
    context: ..
    target: runtime
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    kafka: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.HTTP_PORT||process.env.PORT)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 60s
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-env: &env
  NODE_ENV: production
  LOG_LEVEL: info
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Falta INTERNAL_TOKEN}
  KAFKA_BROKERS: kafka:9092
  REDIS_URL: redis://redis:6379
  AUTH_URL: http://auth:3001
  BUSINESS_URL: http://business:3002
  BOOKING_URL: http://booking:3003
  NOTIFICATIONS_URL: http://notifications:3004
  PAYMENTS_URL: http://payments:3005
  PUBLIC_WEB_URL: ${PUBLIC_URL:?Falta PUBLIC_URL}
  WEB_ORIGIN: ${PUBLIC_URL}

services:
  # ---------- infraestructura ----------

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: turnos
      # Usar una contraseña hexadecimal (va dentro de las URLs de conexión)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_DB: turnos
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: los jobs de BullMQ (recordatorios, vencimientos) sobreviven a un reinicio
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # ---------- servicios ----------

  gateway:
    <<: *service
    environment:
      <<: *env
      SERVICE: api-gateway
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      TRUST_PROXY: 1

  auth:
    <<: *service
    environment:
      <<: *env
      SERVICE: auth-service
      HTTP_PORT: 3001
      DATABASE_URL: postgresql://turnos:${POSTGRES_PASSWORD}@postgres:5432/turnos_auth
      JWT_SECRET: ${JWT_SECRET}

  business:
    <<: *service
    environment:
      <<: *env
      SERVICE: business-service
      HTTP_PORT: 3002
      DATABASE_URL: postgresql://turnos:${POSTGRES_PASSWORD}@postgres:5432/turnos_business

  booking:
    <<: *service
    environment:
      <<: *env
      SERVICE: booking-service
      HTTP_PORT: 3003
      DATABASE_URL: postgresql://turnos:${POSTGRES_PASSWORD}@postgres:5432/turnos_booking

  notifications:
    <<: *service
    environment:
      <<: *env
      SERVICE: notifications-service
      HTTP_PORT: 3004
      DATABASE_URL: postgresql://turnos:${POSTGRES_PASSWORD}@postgres:5432/turnos_notifications
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Turnos <no-reply@example.com>}

  payments:
    <<: *service
    environment:
      <<: *env
      SERVICE: payments-service
      HTTP_PORT: 3005
      DATABASE_URL: postgresql://turnos:${POSTGRES_PASSWORD}@postgres:5432/turnos_payments
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_NOTIFICATION_URL: ${PUBLIC_URL}/api/v1/webhooks/mercadopago

  # ---------- entrada pública ----------

  caddy:
    image: ${TURNOS_WEB_IMAGE:-turnos-web:local}
    build:
      context: ..
      target: web
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_healthy }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT_PUBLIC:-80}:80"
      - "${HTTPS_PORT_PUBLIC:-443}:443"
      - "${HTTPS_PORT_PUBLIC:-443}:443/udp"
    volumes:
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  kafkadata:
  caddydata:
  caddyconfig:
