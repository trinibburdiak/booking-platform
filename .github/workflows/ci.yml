name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit tests (disponibilidad)
        run: pnpm --filter @turnos/availability test
      - name: Integration tests por servicio (Postgres, Redis y Kafka con Testcontainers)
        run: pnpm --workspace-concurrency=1 --filter "./apps/*" test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Infraestructura (Postgres, Redis, Kafka, Mailpit)
        run: docker compose -f infra/docker-compose.yml up -d postgres redis kafka mailpit --wait
      - name: Variables de entorno de cada servicio
        run: for f in apps/*/.env.example; do cp "$f" "${f%.example}"; done
      - name: Bases de datos por servicio
        run: |
          for db in turnos_auth turnos_business turnos_booking turnos_notifications turnos_payments; do
            docker compose -f infra/docker-compose.yml exec -T postgres psql -U turnos -c "create database $db"
          done
          pnpm db:migrate
      - name: Levantar los servicios y el front
        run: |
          nohup pnpm dev > dev.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:3000/health | grep -q '"status":"ok"' && curl -sf http://localhost:5180 >/dev/null && exit 0; sleep 2; done
          cat dev.log; exit 1
      - run: pnpm db:seed
      - run: pnpm --filter @turnos/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @turnos/e2e e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
            dev.log
