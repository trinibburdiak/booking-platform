name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit tests (disponibilidad)
        run: pnpm --filter @turnos/availability test
      - name: Integration tests por servicio (Postgres, Redis y Kafka con Testcontainers)
        run: pnpm --filter "./apps/*" test
      - run: pnpm build
